<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#312e81" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4" />

  <!-- Center Emblem Group -->
  <g filter="url(#glow)" transform="translate(48, 56) scale(0.8125)">
    <!-- Mortarboard Top -->
    <path d="M256 96 L476 196 L256 296 L36 196 Z" fill="url(#capGrad)" />
    
    <!-- Cap Skull & Base Underneath -->
    <path d="M126 237 L126 330 C126 385 184 420 256 420 C328 420 386 385 386 330 L386 237 L256 296 Z" fill="#ffffff" fill-opacity="0.92" />
    
    <!-- Tassel and Ribbon -->
    <path d="M436 215 L436 348 C436 364 424 376 408 376 C392 376 380 364 380 348 L380 240" fill="none" stroke="#fcd34d" stroke-width="12" stroke-linecap="round" />
    <circle cx="408" cy="382" r="14" fill="#f59e0b" />
    <circle cx="256" cy="96" r="16" fill="#fcd34d" />
  </g>

  <!-- Network node connection sparkles -->
  <circle cx="120" cy="130" r="10" fill="rgba(255, 255, 255, 0.6)" />
  <circle cx="392" cy="130" r="10" fill="rgba(255, 255, 255, 0.6)" />
  <circle cx="256" cy="450" r="8" fill="rgba(255, 255, 255, 0.5)" />
</svg>
